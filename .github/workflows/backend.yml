name: backend

# Path-filtered: only backend/** changes trigger this. A PR touching only
# context/**, CLAUDE.md, or frontend/** triggers neither pipeline.
#
# Model (decided 2026-07-04): PR -> build + test only (no GCP access, safe for
# fork PRs); merge to master -> build, push image, deploy WITH traffic. The
# human gate is PR review + merge; a revision that fails its startup probe
# never takes traffic (Cloud Run keeps serving the previous revision).
on:
  push:
    branches: [master]
    paths: ['backend/**']
  pull_request:
    paths: ['backend/**']

permissions:
  contents: read

env:
  PROJECT_ID: plomien-kostrze
  REGION: europe-central2
  IMG: europe-central2-docker.pkg.dev/plomien-kostrze/plomien/plomien-api

jobs:
  # PRs: compile, run tests, prove the image builds. No GCP credentials.
  build-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - run: ./mvnw -B verify

      - run: docker build -t plomien-api:pr-check .

  # Merges to master: full auto-deploy (tests still gate the deploy).
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Keyless auth via Workload Identity Federation — no JSON key in the repo.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - run: ./mvnw -B verify

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: plomien-kostrze
          workload_identity_provider: projects/714793368062/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: gh-deployer@plomien-kostrze.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      # Build on the runner (not Cloud Build) — keeps the deployer SA's roles minimal
      # (no cloudbuild/storage) and mirrors the initial manual deploy.
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build & push image
        run: |
          TAG="ci-${GITHUB_SHA::12}"
          docker build -t "${IMG}:${TAG}" .
          docker push "${IMG}:${TAG}"

      # Deploys WITH traffic (no --no-traffic). Service-level config set outside
      # CI (network/secrets/env vars/max-instances) carries over between revisions.
      # Rollback: gcloud run services update-traffic plomien-api --to-revisions <PREV>=100
      - name: Deploy to Cloud Run (takes traffic)
        run: |
          TAG="ci-${GITHUB_SHA::12}"
          gcloud run deploy plomien-api \
            --image "${IMG}:${TAG}" \
            --region "${REGION}"
