# Tests run against in-memory H2 — CI has no PostgreSQL. Flyway migrations are
# PostgreSQL-specific, so Hibernate generates the schema from entities here;
# the real schema is validated on deploy (ddl-auto=validate + Flyway on boot).
# NOTE: this file SHADOWS src/main/resources/application.properties on the test
# classpath (same name) — every property the app needs must be re-declared here.
app.cors.allowed-origins=http://localhost:4200
spring.datasource.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
# Security config properties — mirrored from main (shadowing). The JWKS URI is
# never fetched in tests (NimbusJwtDecoder loads keys lazily, on first token).
app.admin.uids=
app.firebase.project-id=plomien-kostrze
app.firebase.jwk-set-uri=https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com
# Spring AI / 90minut properties — mirrored from main (shadowing). The api-key is
# deliberately empty (SDK no-auth mode) and the scraper never runs at startup, so
# the context loads offline in CI.
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.api-key=
spring.ai.openai.chat.model=anthropic/claude-sonnet-4.6
spring.ai.openai.chat.temperature=0.7
app.ninetyminut.base-url=http://www.90minut.pl
app.ninetyminut.team-id=3154
app.ninetyminut.season-id=107
