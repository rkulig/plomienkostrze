spring.application.name=plomien-kostrze-api
# Cloud Run injects $PORT; default to 8080 for local runs.
server.port=${PORT:8080}
# CORS allowed origin(s) — set to the Firebase Hosting URL once known (Phase 4).
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}
# Expose only the health endpoint for Cloud Run probes.
management.endpoints.web.exposure.include=health
# Datasource — the DB_* env contract set on the Cloud Run service (deploy-plan
# Phase B); localhost defaults match a local dev PostgreSQL (e.g. Docker).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:plomien}
spring.datasource.username=${DB_USER:plomien}
spring.datasource.password=${DB_PASSWORD:plomien}
# Flyway owns the schema; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
# Admin allowlist: comma-separated Firebase UIDs. Empty = nobody is admin.
app.admin.uids=${ADMIN_UIDS:}
# Firebase ID token verification (stateless resource server, no Admin SDK).
app.firebase.project-id=plomien-kostrze
app.firebase.jwk-set-uri=https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com
