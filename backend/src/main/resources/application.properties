spring.application.name=plomien-kostrze-api
# Cloud Run injects $PORT; default to 8080 for local runs.
server.port=${PORT:8080}
# CORS allowed origin(s) — set to the Firebase Hosting URL once known (Phase 4).
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}
# Expose only the health endpoint for Cloud Run probes.
management.endpoints.web.exposure.include=health
# Datasource — the DB_* env contract set on the Cloud Run service (deploy-plan
# Phase B); localhost defaults match a local dev PostgreSQL (e.g. Docker).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:plomien}
spring.datasource.username=${DB_USER:plomien}
spring.datasource.password=${DB_PASSWORD:plomien}
# Flyway owns the schema; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
# Admin allowlist: comma-separated Firebase UIDs. Empty = nobody is admin.
app.admin.uids=${ADMIN_UIDS:}
# Firebase ID token verification (stateless resource server, no Admin SDK).
app.firebase.project-id=plomien-kostrze
app.firebase.jwk-set-uri=https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com
# News generation (S-03) — Spring AI 2.0 over OpenRouter's OpenAI-compatible API.
# base-url MUST include /v1 (the SDK appends only chat/completions). An empty
# api-key keeps local/CI startup working without the secret (no-auth SDK mode).
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.api-key=${OPENROUTER_API_KEY:}
spring.ai.openai.chat.model=anthropic/claude-sonnet-4.6
spring.ai.openai.chat.temperature=0.7
# Match data source — public, static HTML on 90minut.pl (ISO-8859-2, no auth).
# The site serves no HTTPS (verified 2026-07-08): cleartext HTTP is an accepted
# risk — scraped text only feeds a draft that an admin reviews before publishing.
app.ninetyminut.base-url=${NINETYMINUT_BASE_URL:http://www.90minut.pl}
app.ninetyminut.team-id=${NINETYMINUT_TEAM_ID:3154}
# 90minut season id (non-obvious scheme: 107=2025/26, 109=2026/27). Bump once a season.
app.ninetyminut.season-id=${NINETYMINUT_SEASON_ID:107}
