<section class="forum-login-gate">
  <div class="band">
    <div class="band__inner container container--forum">
      <p class="band__eyebrow">Społeczność Dzików</p>
      <h1 class="band__title">Forum kibiców</h1>
    </div>
  </div>

  <div class="gate container container--forum">
    <p class="gate__note">
      Zaloguj się, aby zakładać tematy i odpowiadać na forum. Forum klubowe jest
      dostępne tylko dla zalogowanych kibiców.
    </p>
    <button type="button" class="btn btn--primary" (click)="signIn()">Zaloguj się przez Google</button>
  </div>
</section>
