<article class="news-detail">
  @if (busy()) {
    <p class="note">Ładowanie…</p>
  } @else if (notFound()) {
    <p class="error">Nie znaleziono wpisu.</p>
    <a routerLink="/">Wróć do listy aktualności</a>
  } @else if (post(); as post) {
    <header>
      <h1>{{ post.title }}</h1>
      <p class="date">{{ post.publishedAt | date: 'dd.MM.yyyy' }}</p>
    </header>

    @for (paragraph of paragraphs(); track $index) {
      <p class="paragraph">{{ paragraph }}</p>
    }

    <a class="back" routerLink="/">← Wróć do listy</a>
  }
</article>
