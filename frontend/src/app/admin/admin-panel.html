<section class="admin-panel">
  @if (ready() === true) {
    <h1>Nowy wpis</h1>

    <div class="generate">
      <button type="button" (click)="generate()" [disabled]="generating()">
        {{ generating() ? 'Generowanie…' : 'Generuj z ostatniego meczu' }}
      </button>
      @if (hasProposal()) {
        <button type="button" (click)="reject()">Odrzuć</button>
      }
    </div>

    @if (generationError(); as generationError) {
      <p class="error">{{ generationError }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="publish()">
      <label>
        Tytuł
        <input type="text" formControlName="title" maxlength="200" />
      </label>

      <label>
        Treść
        <textarea
          formControlName="content"
          maxlength="10000"
          rows="12"
          placeholder="Czysty tekst — akapity oddzielaj pustą linią."
        ></textarea>
      </label>

      @if (error(); as error) {
        <p class="error">{{ error }}</p>
      }

      <button type="submit" [disabled]="form.invalid || sending()">
        {{ sending() ? 'Publikowanie…' : 'Opublikuj' }}
      </button>
    </form>
  } @else {
    <p class="note">Ładowanie…</p>
  }
</section>
